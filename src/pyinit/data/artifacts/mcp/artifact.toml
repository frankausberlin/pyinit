id = "mcp"
description = "MCP server with a tool, a resource, stdio entry point, Inspector recipe, and smoke test"
modes = ["app"]
conflicts = ["cli", "app-main"]
provides = ["entrypoint.mcp"]
runtime_dependencies = ["mcp>=2.3.0,<3"]
files = [
  { source = "templates/server.py.j2", target = "src/{{ package_name }}/server.py" },
  { source = "templates/main.py.j2", target = "src/{{ package_name }}/main.py" },
  { source = "templates/test_smoke.py.j2", target = "tests/test_smoke.py" },
]
just_fragments = ["templates/justfile.j2"]
