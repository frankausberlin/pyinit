{% extends "base.html" %}

{% block title %}Records - {{ settings.app_name }}{% endblock %}

{% block content %}
<h1>Records</h1>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    {% for record in records %}
    <tr>
      <td><a href="/records/{{ record.id }}">{{ record.id }}</a></td>
      <td>{{ record.title }}</td>
      <td>{{ record.status }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
